# Mosquitto broker configuration
# Designed for local LAN use; no internet required.
#
# On Raspberry Pi: copy this file to /etc/mosquitto/conf.d/health.conf
# On macOS (dev):  mosquitto -c config/mosquitto.conf

listener 1883 0.0.0.0
allow_anonymous true

# Logging – reduce noise; increase to 'all' for debugging
log_type error
log_type warning
log_type notice
log_type information


# Maximum in-flight messages per client
max_inflight_messages 20
